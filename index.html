<title>Wallet — Cashflow Tracker</title>
<style>
:root{
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e2e1dc;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984;
  --accent:#2a78d6; --accent-ink:#fff;
  --good:#1a8a4a; --warn:#b57400; --bad:#d23b3b;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;
  --grid:#e8e7e2;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111110; --surface:#1a1a19; --surface-2:#232321; --border:#2e2e2b;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8984;
  --accent:#3987e5;
  --good:#3fb874; --warn:#e0a020; --bad:#e66767;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--s8:#e66767;
  --grid:#2a2a28;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .sec{color:var(--text-2)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.small{font-size:12px}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;font-size:17px;padding:4px 10px 16px;display:flex;align-items:center;gap:8px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2a78d6,#1baf7a);display:grid;place-items:center;color:#fff;font-size:15px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--text-2);width:100%}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--surface-2);color:var(--text);font-weight:600}
.nav-btn .ic{width:20px;text-align:center}
.side .spacer{flex:1}
.main{flex:1;min-width:0;padding:18px 24px 100px;max-width:1280px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.topbar h1{font-size:22px;margin:0;flex:1}
.bottom-nav{display:none}

.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.icon-btn:hover{background:var(--surface-2)}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.sec-btn{background:var(--surface-2);color:var(--text)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.link-btn{background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px}

.sync-pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);cursor:pointer;border:0}
.sync-pill.ok::before{content:"● ";color:var(--good)}
.sync-pill.err::before{content:"● ";color:var(--bad)}
.sync-pill.off::before{content:"● ";color:var(--muted)}
.sync-pill.busy::before{content:"◌ ";color:var(--accent)}

/* cards & grid */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.hero{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.5px}
.stat .lbl{font-size:12px;color:var(--text-2)}
.stat .val{font-size:18px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--surface-2);color:var(--text-2)}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)}

.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--border);margin-bottom:12px}
.banner.warn{border-color:var(--warn)} .banner.bad{border-color:var(--bad)}
.banner .grow{flex:1}

/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t2{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.click{cursor:pointer;border-radius:8px}
.row.click:hover{background:var(--surface-2)}
.dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.amt{font-weight:600;white-space:nowrap}
.date-head{font-size:12px;color:var(--muted);padding:12px 4px 2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* account tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{border-radius:16px;padding:14px;color:#fff;position:relative;cursor:pointer;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);overflow:hidden}
.tile::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.1)}
.tile .nm{font-weight:600;font-size:14px;opacity:.95}
.tile .ty{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.tile .bal{font-size:22px;font-weight:700}
.tile .meta{font-size:12px;opacity:.9}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.3);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:#fff;border-radius:4px}
.pbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pbar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.tile.archived{opacity:.5}

/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;width:max-content;max-width:100%;overflow:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--text-2);white-space:nowrap}
.tabs button.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* forms */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{max-width:760px}
.modal h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center}
.modal h2 .grow{flex:1}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--text-2);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.field input:focus,.field select:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;cursor:pointer;color:var(--text-2)}
.seg button.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.amount-input{font-size:28px!important;font-weight:700;text-align:center}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.actions .grow{flex:1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;gap:5px;align-items:center;padding:4px 8px;border:1px solid var(--border);border-radius:8px;font-size:12px;cursor:pointer}
.fav-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.fav{flex:none;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px;white-space:nowrap}
.fav:hover{border-color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:12px}

.fab{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 8px 24px rgba(42,120,214,.4);z-index:30}

/* charts */
.chart-box{position:relative;height:240px}
.chart-box.tall{height:300px}
.w-tools{display:flex;gap:2px}
.w-tools button{border:0;background:none;cursor:pointer;color:var(--muted);padding:2px 5px;border-radius:6px;font-size:13px}
.w-tools button:hover{background:var(--surface-2);color:var(--text)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat div{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat-wrap{display:flex;gap:6px}
.heat-days{display:grid;grid-template-rows:repeat(7,13px);gap:3px;font-size:9px;color:var(--muted)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:left}
table.tbl th{color:var(--text-2);font-weight:600;font-size:12px}
table.tbl td.r,table.tbl th.r{text-align:right}

/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.pin-dots{display:flex;gap:12px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--text-2)}
.pin-dots i.on{background:var(--text)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{height:72px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:24px;cursor:pointer}
.keypad button:active{background:var(--surface-2)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:200;font-size:13px;box-shadow:var(--shadow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:12px}
.cal .h{color:var(--muted);text-align:center;font-weight:600}
.cal .d{min-height:54px;border:1px solid var(--border);border-radius:8px;padding:4px;overflow:hidden}
.cal .d.today{border-color:var(--accent)}
.cal .d.other{opacity:.35}
.cal .ev{font-size:10px;border-radius:4px;padding:1px 4px;margin-top:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px;text-align:center;color:var(--muted)}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:var(--surface-2)}

@media (max-width:860px){
  .side{display:none}
  .main{padding:12px 12px 110px}
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bottom-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--muted);cursor:pointer;padding:4px 0}
  .bottom-nav button .ic{font-size:19px}
  .bottom-nav button.active{color:var(--accent)}
  .fab{bottom:calc(78px + env(safe-area-inset-bottom));right:16px}
  .span-8,.span-6,.span-4,.span-3{grid-column:span 12}
  .hero .big{font-size:28px}
  .topbar h1{font-size:19px}
  .modal-bg{align-items:flex-end;padding:0}
  .modal{border-radius:18px 18px 0 0;max-height:94vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .field input,.field select,.inp{font-size:16px}
  .hide-m{display:none!important}
}
@media (min-width:861px) and (max-width:1100px){.span-4,.span-3{grid-column:span 6}}

input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}

</style>

<script>
/* ============ Wallet Tracker — core ============ */
'use strict';
const APP_VERSION = '1.1.0';
const LS_DATA = 'wt_data_v1', LS_LOCAL = 'wt_local_v1';
const COLLECTIONS = ['accounts','txns','categories','installments','recurring','goals','templates','widgets'];
const ACC_TYPES = {bank:'Bank', ewallet:'E-wallet', cash:'Cash', investment:'Investment', credit:'Credit card', other:'Other'};
const PALETTE_VARS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'];

/* ---------- utils ---------- */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const now = () => Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => dstr(new Date());
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return dstr(d); };
const dim = (y, m) => new Date(y, m+1, 0).getDate(); // m 0-based
const dayIn = (y, m, day) => dstr(new Date(y, m, Math.min(day, dim(y, m))));
const addMonths = (s, n) => { const d = pd(s); const day = d.getDate(); const t = new Date(d.getFullYear(), d.getMonth()+n, 1); return dayIn(t.getFullYear(), t.getMonth(), day); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtD = s => { if(!s) return ''; const d = pd(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`; };
const fmtDs = s => { const d = pd(s); return `${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const monthKey = s => s.slice(0,7);
const fmtMonth = k => { const [y,m] = k.split('-'); return `${MONTHS[m-1]} ${y}`; };
const weekStart = s => { const d = pd(s); d.setDate(d.getDate() - d.getDay()); return dstr(d); }; // Sunday start
const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const sum = (arr, f = x => x) => arr.reduce((a, x) => a + (f(x) || 0), 0);
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const series = i => cssVar(PALETTE_VARS[i % 8]);

function fmt(n, opts = {}) {
  if (local.hideAmounts && !opts.force) return '₱••••';
  const neg = n < 0; const v = Math.abs(n || 0);
  const s = v.toLocaleString('en-PH', {minimumFractionDigits: opts.dec === 0 ? 0 : 2, maximumFractionDigits: opts.dec === 0 ? 0 : 2});
  return (neg ? '−' : (opts.sign && n > 0 ? '+' : '')) + '₱' + s;
}
function fmtK(n) {
  if (local.hideAmounts) return '••';
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + '₱' + (a/1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return s + '₱' + (a/1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  return s + '₱' + a.toFixed(0);
}

/* ---------- state ---------- */
let data = null, local = null;

/* Default items get fixed IDs so two devices set up separately merge without duplicates */
const seedId = (pre, name) => pre + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
function migrateSeedIds() {
  const def = defaultData(); let changed = false;
  for (const [k, pre, key] of [['accounts', 'acc', 'name'], ['categories', 'cat', 'name'], ['widgets', 'w', 'title']]) {
    const want = new Set(def[k].map(x => x.id));
    for (const x of data[k]) {
      if (x.deleted || want.has(x.id)) continue;
      const nid = seedId(pre, x[key] || '');
      if (!want.has(nid) || data[k].some(y => y.id === nid)) continue;
      const old = x.id; x.id = nid; changed = true;
      for (const t of data.txns) { for (const f of ['accountId', 'toAccountId', 'categoryId']) if (t[f] === old) t[f] = nid; }
      for (const c of ['installments', 'recurring', 'goals', 'templates']) for (const o of data[c]) for (const f of ['accountId', 'toAccountId', 'categoryId', 'cardId']) if (o[f] === old) o[f] = nid;
      for (const o of data.widgets) if (o.filters) for (const f of ['accounts', 'categories']) if (o.filters[f]) o.filters[f] = o.filters[f].map(v => v === old ? nid : v);
      if (local.lastAcc === old) local.lastAcc = nid;
    }
  }
  return changed;
}
function defaultData() {
  const t = now(), td = today();
  const acc = (name, type, color, extra = {}) => ({id: seedId('acc', name), name, type, color, opening: 0, openingDate: td, archived: false, excludeNW: false, u: 1, ...extra});
  const card = (name, color) => acc(name, 'credit', color, {limit: 0, cutoffDay: null, dueDay: null, minPct: 3, minAmt: 500, interest: 3, annualFee: 0, feeMonth: null, waiverSpend: 0, points: 0, pointsNote: ''});

/* ============ Charts & chart builder ============ */
const METRICS = {
  expense: 'Spending', income: 'Income', net: 'Net cashflow (income − spending)', cashflow: 'Income vs spending',
  networth: 'Net worth', balance: 'Account balances', utilization: 'Card utilization', budget: 'Budget vs actual', cardspend: 'Credit card spending'
};
const GROUPS = {day: 'Day', week: 'Week', month: 'Month', category: 'Category', account: 'Account', payee: 'Payee', tag: 'Tag', weekday: 'Weekday'};
const RANGES = {period: 'This period', lastperiod: 'Last period', '30d': 'Last 30 days', '90d': 'Last 90 days', '26w': 'Last 26 weeks', '6m': 'Last 6 months', '12m': 'Last 12 months', ytd: 'Year to date', all: 'All time', custom: 'Custom'};
const CTYPES = {line: 'Line', area: 'Area', bar: 'Bar', stacked: 'Stacked bar', hbar: 'Horizontal bar', doughnut: 'Donut', pie: 'Pie', heatmap: 'Calendar heatmap', table: 'Table'};
const SPLITS = {none: 'None', category: 'Category', account: 'Account'};
const TIME_GROUPS = ['day', 'week', 'month'];

function rangeDates(spec) {
  const td = today();
  switch (spec.range) {
    case 'period': { const p = periodOf(td); return [p.start, p.end]; }
    case 'lastperiod': { const p = periodOf(td, undefined, -1); return [p.start, p.end]; }
    case '30d': return [addDays(td, -29), td];
    case '90d': return [addDays(td, -89), td];
    case '26w': return [weekStart(addDays(td, -7 * 25)), td];
    case '6m': return [dstr(new Date(pd(td).getFullYear(), pd(td).getMonth() - 5, 1)), td];
    case '12m': return [dstr(new Date(pd(td).getFullYear(), pd(td).getMonth() - 11, 1)), td];
    case 'ytd': return [td.slice(0, 4) + '-01-01', td];
    case 'custom': return [spec.from || addDays(td, -30), spec.to || td];
    default: { const ds = txns().map(t => t.date).sort(); const accs = accounts(true).map(a => a.openingDate).sort(); const first = [ds[0], accs[0]].filter(Boolean).sort()[0] || addDays(td, -30); return [first, td]; }
  }
}
function timeBuckets(a, b, g) {
  const keys = [], labels = [], ends = [];
  if (g === 'day') { for (let d = a; d <= b; d = addDays(d, 1)) { keys.push(d); labels.push(fmtDs(d)); ends.push(d); } }
  else if (g === 'week') { for (let d = weekStart(a); d <= b; d = addDays(d, 7)) { keys.push(d); labels.push(fmtDs(d)); ends.push(addDays(d, 6) > b ? b : addDays(d, 6)); } }
  else { let d = a.slice(0, 7) + '-01'; while (d <= b) { const k = monthKey(d); keys.push(k); labels.push(fmtMonth(k).replace(/ (\d\d)(\d\d)$/, " '$2")); const e = addDays(addMonths(d, 1), -1); ends.push(e > b ? b : e); d = addMonths(d, 1); } }
  return {keys, labels, ends};
}
const bucketOf = (date, g) => g === 'day' ? date : g === 'week' ? weekStart(date) : monthKey(date);

function filterTx(spec) {
  const [a, b] = rangeDates(spec); const f = spec.filters || {};

    && (!f.accounts || !f.accounts.length || f.accounts.includes(t.accountId) || f.accounts.includes(t.toAccountId))
    && (!f.categories || !f.categories.length || f.categories.includes(t.categoryId))

}

    case 'category': return catName(t.categoryId);
    case 'account': return accName(t.accountId);
    case 'payee': return (t.payee || '(no payee)').trim();
    case 'weekday': return WD[pd(t.date).getDay()];

}

  const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if (arr.length <= n + 1) return arr;
  const top = arr.slice(0, n); top.push(['Other', sum(arr.slice(n), x => x[1])]); return top;
}

/* returns {labels, datasets:[{label,data,kind?}], unit, timeseries} */
function queryChart(spec) {
  const [a, b] = rangeDates(spec); const g = spec.groupBy || 'month';
  const isTime = TIME_GROUPS.includes(g);
  const metric = spec.metric;
  if (metric === 'networth' || metric === 'balance') {
    const tb = timeBuckets(a, b, isTime ? g : 'month');
    if (metric === 'networth') return {labels: tb.labels, datasets: [{label: 'Net worth', data: netWorthSeries(tb.ends)}], timeseries: true};
    let accs = accounts(true).filter(x => !(spec.filters?.accounts?.length) || spec.filters.accounts.includes(x.id));
    if (!spec.filters?.accounts?.length) accs = accs.filter(x => !x.archived);
    accs = accs.slice(0, 8);
    return {labels: tb.labels, datasets: accs.map(x => ({label: x.name, data: balanceSeries(x.id, tb.ends)})), timeseries: true};
  }
  if (metric === 'utilization') {
    const cs = cards().map(c => ({c, i: cardInfo(c)}));
    return {labels: cs.map(x => x.c.name), datasets: [{label: 'Utilization %', data: cs.map(x => x.i.util == null ? 0 : round2(x.i.util * 100))}], unit: '%'};
  }
  if (metric === 'budget') {
    const p = periodOf(today()); const cs = cats('expense').filter(c => +c.budget);
    return {labels: cs.map(c => c.name), datasets: [
      {label: 'Budget', data: cs.map(c => budgetFor(c)), muted: true},
      {label: 'Spent', data: cs.map(c => spendIn(p.start, p.end, t => t.categoryId === c.id))}]};
  }
  let tx = filterTx(spec);
  if (metric === 'cardspend') tx = tx.filter(t => t.type === 'expense' && isCreditAcc(t.accountId));
  const val = t => metric === 'net' ? (t.type === 'income' ? +t.amount : t.type === 'expense' ? -t.amount : 0) : +t.amount;
  if (metric === 'expense') tx = tx.filter(isSpend);
  if (metric === 'income') tx = tx.filter(t => t.type === 'income');
  if (metric === 'net') tx = tx.filter(t => t.type === 'income' || t.type === 'expense');
  if (metric === 'cashflow') {
    const tb = timeBuckets(a, b, isTime ? g : 'month'); const gg = isTime ? g : 'month';
    const inc = {}, exp = {};
    for (const t of tx) { const k = bucketOf(t.date, gg); if (t.type === 'income') inc[k] = (inc[k] || 0) + +t.amount; if (t.type === 'expense') exp[k] = (exp[k] || 0) + +t.amount; }
    return {labels: tb.labels, datasets: [{label: 'Income', data: tb.keys.map(k => round2(inc[k] || 0))}, {label: 'Spending', data: tb.keys.map(k => round2(exp[k] || 0))}], timeseries: true};
  }
  if (g === 'tag') {
    const m = {}; for (const t of tx) for (const tg of (t.tags || [])) m['#' + tg] = (m['#' + tg] || 0) + val(t);
    const arr = topN(m, spec.chartType === 'table' ? 50 : 9);
    return {labels: arr.map(x => x[0]), datasets: [{label: METRICS[metric], data: arr.map(x => round2(x[1]))}]};
  }
  if (isTime) {
    const tb = timeBuckets(a, b, g);
    const split = spec.split && spec.split !== 'none' ? spec.split : null;
    if (!split) {
      const m = {}; for (const t of tx) { const k = bucketOf(t.date, g); m[k] = (m[k] || 0) + val(t); }
      return {labels: tb.labels, datasets: [{label: METRICS[metric], data: tb.keys.map(k => round2(m[k] || 0))}], timeseries: true, keys: tb.keys};
    }
    const tot = {}; for (const t of tx) { const s = keyOf(t, split); tot[s] = (tot[s] || 0) + val(t); }
    const top = topN(tot, 7).map(x => x[0]); const topSet = new Set(top);
    const m = {}; for (const t of tx) { let s = keyOf(t, split); if (!topSet.has(s)) s = 'Other'; const k = bucketOf(t.date, g); m[s] = m[s] || {}; m[s][k] = (m[s][k] || 0) + val(t); }
    return {labels: tb.labels, datasets: top.map(s => ({label: s, data: tb.keys.map(k => round2((m[s] || {})[k] || 0))})), timeseries: true};
  }
  const m = {}; for (const t of tx) { const k = keyOf(t, g); m[k] = (m[k] || 0) + val(t); }
  let arr = g === 'weekday' ? WD.map(d => [d, m[d] || 0]) : topN(m, spec.chartType === 'table' ? 50 : (['doughnut', 'pie'].includes(spec.chartType) ? 6 : 9));
  return {labels: arr.map(x => x[0]), datasets: [{label: METRICS[metric], data: arr.map(x => round2(x[1]))}]};
}

    localStorage.setItem('wt_pkce', JSON.stringify({verifier, st, t: now()}));

  async function dailyBackup() {

    local.lastCloudBackup = td; saveLocal();
    try {
      const r = await api('/files/list_folder', {path: '/backups', limit: 2000});
      if (r.ok) { const j = await r.json(); const items = (j.entries || []).filter(x => /^wallet-\d{4}-\d\d-\d\d\.json$/.test(x.name)).sort((a, b) => a.name < b.name ? 1 : -1);
        for (const x of items.slice(30)) await api('/files/delete_v2', {path: x.path_lower}); }

  }
  async function run(manual = false) {

    if (!navigator.onLine) { setStatus('off', 'Offline — will sync'); return; }

        purgeOldTombstones(); materialize(); saveRaw();

  }

    Object.assign(C(), {token: null, refresh: null, exp: 0, account: '', needsLogin: false}); saveLocal(); setStatus('off', 'Local only');
  }

/* ============ v1.1 — Financial manager: health, cards mastery ============ */
const CHANGELOG = {
  '1.1.0': ['🩺 Financial Health Score (0–100) with tips — Insights › Health', '🛟 Emergency fund meter & income-loss runway', '⚖️ 50/30/20 needs / wants / savings check', '📈 Lifestyle-inflation alerts',
    '💰 Payday planner for the 10th & 25th — Plan › Payday plan', '✨ Best card per category (set rebate rates per card) + suggestion when adding expenses', '🛡 Interest & fees avoided + fee log — Insights › Card insights', '🏁 Debt payoff planner (avalanche vs snowball) — Insights › Debt payoff']
};
const BUCKETS = {need: 'Need', want: 'Want', save: 'Savings'};
const DEFAULT_BUCKET = {groceries: 'need', transport_gas: 'need', bills_utilities: 'need', load_internet: 'need', health: 'need', education: 'need', family_padala: 'need', fees_charges: 'need', food: 'want', shopping: 'want', entertainment: 'want', subscriptions: 'want', others: 'want'};
const catBucket = c => c.bucket || DEFAULT_BUCKET[(c.id || '').replace(/^cat_/, '')] || DEFAULT_BUCKET[seedId('', c.name).slice(1)] || 'want';

/* ---------- averages ---------- */
function dataStart() { const ds = [...txns().map(t => t.date), ...accounts(true).map(a => a.openingDate)].sort(); return ds[0] || today(); }
/* last n complete months that fall after the data start; falls back to current month pace */
function monthlyAvg(fn, n = 3) {
  const start = dataStart(); const vals = [];
  for (let k = 1; k <= n; k++) { const p = periodOf(today(), 'month', -k); if (p.end < start) break; vals.push(fn(p.start, p.end)); }
  if (vals.length) return sum(vals) / vals.length;
  const p = periodOf(today(), 'month'); const el = diffDays(p.start, today()) + 1; return fn(p.start, today()) / el * 30.4;
}
const avgSpend = (n = 3) => monthlyAvg((a, b) => spendIn(a, b), n);
const avgIncome = (n = 3) => monthlyAvg((a, b) => incomeIn(a, b), n);

/* ---------- emergency fund & runway ---------- */
function efAccounts() { const sel = data.prefs.efAccounts; const liq = accounts().filter(a => a.type !== 'credit' && a.type !== 'investment'); return sel && sel.length ? accounts().filter(a => sel.includes(a.id)) : liq; }
function emergencyFund() {
  const target = +data.prefs.efMonths || 6; const exp = avgSpend(3);
  const essential = monthlyAvg((a, b) => spendIn(a, b, t => catBucket(byId('categories', t.categoryId) || {}) === 'need'), 3);
  const bal = sum(efAccounts(), a => Math.max(0, balance(a)));
  const months = exp > 0 ? bal / exp : null; const monthsEss = essential > 0 ? bal / essential : null;
  return {bal, exp, essential, months, monthsEss, target, need: Math.max(0, target * exp - bal)};
}
function runway() { const t = totals(); const exp = avgSpend(3); const debt = sum(cards(), c => cardInfo(c).owed); return {months: exp > 0 ? (t.liquid - debt) / exp : null, liquid: t.liquid, debt, exp}; }

/* ---------- 50/30/20 ---------- */
function rule503020(p) {
  const inc = incomeIn(p.start, p.end); const by = {need: 0, want: 0};
  for (const t of txns()) if (isSpend(t) && inRange(t, p.start, p.end)) { const c = byId('categories', t.categoryId); by[c ? (catBucket(c) === 'save' ? 'want' : catBucket(c)) : 'want'] += +t.amount; }
  const saveCats = txns().filter(t => isSpend(t) && inRange(t, p.start, p.end) && catBucket(byId('categories', t.categoryId) || {}) === 'save');
  const savedSpend = sum(saveCats, t => +t.amount); by.want -= savedSpend;
  const invest = sum(txns().filter(t => t.type === 'transfer' && inRange(t, p.start, p.end) && byId('accounts', t.toAccountId)?.type === 'investment'), t => +t.amount);
  const save = Math.max(0, inc - by.need - by.want) + savedSpend;
  return {inc, need: by.need, want: by.want, save, invest};
}

/* ---------- lifestyle inflation ---------- */
function inflation() {
  const per = k => periodOf(today(), 'month', -k);
  const start = dataStart();
  const recent = [1, 2, 3].map(per), prior = [4, 5, 6].map(per);
  if (prior[2].start < start) return null;
  const s = arr => sum(arr, p => spendIn(p.start, p.end)) / 3, i = arr => sum(arr, p => incomeIn(p.start, p.end)) / 3;
  const sR = s(recent), sP = s(prior), iR = i(recent), iP = i(prior);
  return {spendGrowth: sP ? (sR - sP) / sP : 0, incomeGrowth: iP ? (iR - iP) / iP : 0, sR, sP, iR, iP};

/* ---------- card history: interest avoided / charged ---------- */
function cardHistory(card, months = 12) {
  const out = []; if (!card.cutoffDay || !card.dueDay) return out;
  let cut = cutoffOnOrBefore(card, today());
  for (let k = 0; k < months && cut && cut >= card.openingDate; k++) {
    const due = dueAfterCutoff(card, cut); const owed = Math.max(0, -balance(card, cut));
    if (due < today() && owed > 0) {
      const paid = sum(txns().filter(t => t.date > cut && t.date <= due && (t.toAccountId === card.id || (t.type === 'income' && t.accountId === card.id))), t => +t.amount);
      out.push({cut, due, owed, paid, full: paid >= owed - 1, interest: owed * (+card.interest || 3) / 100});
    }
    cut = cutoffOnOrBefore(card, addDays(cut, -1));
  }
  return out;
}
function feeLog(days = 365) { return sortTx(txns().filter(t => isSpend(t) && t.date >= addDays(today(), -days) && (t.tags || []).some(x => x === 'interest' || x === 'late-fee' || x === 'card-fee'))); }
function interestSummary() {
  let avoided = 0, onTime = 0, late = 0;
  for (const c of cards()) for (const h of cardHistory(c)) { if (h.full) { avoided += h.interest; onTime++; } else late++; }
  const fees = feeLog(); return {avoided, onTime, late, fees, feeTotal: sum(fees, t => +t.amount)};
}

/* ---------- best card per category ---------- */
const cardRate = (c, catId) => { const r = c.rates || {}; return +(r[catId] ?? r.default ?? 0) || 0; };
function bestCardFor(catId) {
  const opts = cards().map(c => ({c, i: cardInfo(c), rate: cardRate(c, catId)})).filter(x => x.i.util == null || x.i.util < 0.8);
  if (!opts.length) return null;
  opts.sort((a, b) => (b.rate - a.rate) || ((b.i.floatDays ?? 0) - (a.i.floatDays ?? 0)));
  const top = opts[0]; if (!top.rate && top.i.floatDays == null) return null; return top;
}
function rewardsEarned(a, b) { return sum(txns().filter(t => isSpend(t) && inRange(t, a, b) && isCreditAcc(t.accountId)), t => +t.amount * cardRate(byId('accounts', t.accountId), t.categoryId) / 100); }

  const lp = periodOf(today(), 'month', -1); const bc = cats('expense').filter(c => +c.budget);
  const within = bc.filter(c => spendIn(lp.start, lp.end, t => t.categoryId === c.id) <= +c.budget).length;
  parts.push({key: 'budget', label: 'Budget discipline', w: 10, score: bc.length ? within / bc.length * 100 : 50, value: bc.length ? `${within}/${bc.length} on budget last month` : 'No budgets',
    tip: bc.length ? (within === bc.length ? 'All budgets kept last month.' : 'Review categories that went over in Plan › Budgets.') : 'Set budgets for your top spending categories.'});

function gaugeSVG(score, size = 140) {

/* ---------- payday planner ---------- */
function paydayPlan(offset = 0) {
  const p = periodOf(today(), 'cycle', offset); const start = p.start, end = p.end;
  const recInc = sum(upcomingBills(start, end).filter(b => b.r.type === 'income'), b => +b.r.amount);
  const logged = incomeIn(start, end);
  const hist = [1, 2, 3, 4].map(k => periodOf(today(), 'cycle', offset - k)).map(q => incomeIn(q.start, q.end)).filter(x => x > 0);
  const expected = Math.max(recInc, logged) || (hist.length ? sum(hist) / hist.length : 0);
  const items = [];
  for (const c of cards()) {
    const i = cardInfo(c); if (!i.st) continue;
    if (i.st.due >= start && i.st.due <= addDays(end, 3)) items.push({kind: 'card', icon: '💳', name: `${c.name} statement`, date: i.st.due, amount: i.st.remaining, done: i.st.remaining <= 0, min: i.st.minDue, card: c});
  }
  for (const b of upcomingBills(start, end).filter(b => (b.r.type || 'expense') === 'expense' && !isCreditAcc(b.r.accountId))) items.push({kind: 'bill', icon: '📄', name: b.r.name, date: b.date, amount: +b.r.amount, done: b.posted, bill: b});
  const share = Math.max(1, (data.prefs.paydays || [10, 25]).length);
  const budg = cats('expense').filter(c => +c.budget);
  const budgetLeft = sum(budg, c => Math.max(0, +c.budget / share - spendIn(start, end, t => t.categoryId === c.id && !t.recurringId)));
  if (budg.length) items.push({kind: 'budget', icon: '🛒', name: 'Day-to-day spending (budgets left)', amount: round2(budgetLeft), done: false});
  for (const g of live('goals')) {
    const saved = goalSaved(g); if (saved >= +g.target) continue;
    const ml = g.deadline ? Math.max(1, Math.ceil(diffDays(today(), g.deadline) / 30.4)) : 12;
    items.push({kind: 'goal', icon: g.icon || '🎯', name: `Goal: ${g.name}`, amount: round2((+g.target - saved) / ml / share), done: false});
  }
  const committed = sum(items.filter(x => !x.done), x => x.amount);
  return {p, expected, logged, items, committed, left: expected - committed};
}

/* ---------- debt payoff simulation ---------- */
function debtList() {
  return cards().map(c => ({id: c.id, name: c.name, bal: cardInfo(c).owed, rate: (+c.interest || 3) / 100, minPct: (+c.minPct || 3) / 100, minAmt: +c.minAmt || 500})).filter(d => d.bal > 0);
}
function simulate(debts, budget, strategy) {
  const ds = debts.map(d => ({...d}));
  let month = 0, interest = 0; const done = {};
  const instMonthly = sum(live('installments'), p => { const s = installmentState(p); return s.left > 0 ? +p.monthly : 0; });
  while (ds.some(d => d.bal > 0.5) && month < 600) {
    month++;
    for (const d of ds) { d.int = 0; if (d.bal > 0) { d.int = d.bal * d.rate; d.bal += d.int; interest += d.int; } }
    let pool = budget;
    const live_ = ds.filter(d => d.bal > 0.5);
    // minimum due ≈ the higher of: % of balance, this month's interest + 1% of principal, or the peso floor
    for (const d of live_) { const m = Math.min(d.bal, Math.max(d.bal * d.minPct, d.int + (d.bal - d.int) * 0.01, d.minAmt)); d.bal -= m; pool -= m; }
    if (pool < 0) return {ok: false, need: budget - pool, instMonthly};
    if (strategy === 'minimums') { for (const d of ds) if (d.bal <= 0.5 && !done[d.id]) { done[d.id] = month; d.bal = 0; } continue; }
    const order = live_.filter(d => d.bal > 0.5).sort(strategy === 'avalanche' ? (a, b) => b.rate - a.rate || a.bal - b.bal : (a, b) => a.bal - b.bal);
    for (const d of order) { if (pool <= 0) break; const pay = Math.min(pool, d.bal); d.bal -= pay; pool -= pay; }
    for (const d of ds) if (d.bal <= 0.5 && !done[d.id]) { done[d.id] = month; d.bal = 0; }
  }
  return {ok: month < 600, months: month, interest, done, instMonthly};
}

/* ---------- views ---------- */
function insHealth(el) {

function txRow(t, showAcc = true) {

  let title, sub, amt, cls = '';

  else if (t.type === 'adjust') { title = t.payee || 'Balance adjustment'; sub = accName(t.accountId); amt = fmt(+t.amount, {sign: true}); cls = 'sec'; }
  else { title = t.payee || catName(t.categoryId); sub = `${catName(t.categoryId)}${showAcc ? ' · ' + accName(t.accountId) : ''}`; amt = t.type === 'income' ? fmt(+t.amount, {sign: true}) : fmt(-t.amount); cls = t.type === 'income' ? 'good' : ''; }
  const tags = (t.tags || []).filter(x => x !== 'recurring' && x !== 'installment').map(x => `#${esc(x)}`).join(' ');

    <div class="amt num ${cls}">${amt}</div></div>`;
}
function bindTxRows(root) { $$('[data-tx]', root).forEach(r => r.onclick = () => openTxn({id: r.dataset.tx})); }
function groupedTx(list) {
  let html = '', last = '';
  for (const t of list) { if (t.date !== last) { last = t.date; const dayTot = sum(list.filter(x => x.date === t.date && x.type === 'expense'), x => +x.amount); html += `<div class="date-head">${t.date === today() ? 'Today' : t.date === addDays(today(), -1) ? 'Yesterday' : WD[pd(t.date).getDay()] + ', ' + fmtD(t.date)}${dayTot ? ` · <span class="num">${fmt(-dayTot)}</span>` : ''}</div>`; } html += txRow(t); }

}

function exportJSON() { download(`wallet-backup-${today()}.json`, JSON.stringify(data)); local.lastExport = now(); saveLocal(); render(); }
function exportCSV(list) {
  const rows = [['Date', 'Type', 'Amount', 'Account', 'To account', 'Category', 'Payee', 'Tags', 'Note']];
  for (const t of list) rows.push([t.date, t.type, t.type === 'expense' ? -t.amount : t.amount, accName(t.accountId), t.toAccountId ? accName(t.toAccountId) : '', t.categoryId ? catName(t.categoryId) : '', t.payee || '', (t.tags || []).join(' '), t.note || '']);
  download(`wallet-transactions-${today()}.csv`, '﻿' + toCSV(rows), 'text/csv');
}
function importJSON(e) {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => {
    try { const d = JSON.parse(r.result); if (!d.accounts || !d.txns) throw new Error('Not a wallet backup');
      const replace = confirmBox(`Backup has ${d.txns.filter(x => !x.deleted).length} transactions.\n\nOK = MERGE with current data (recommended)\nCancel = choose replace`);
      if (replace) data = mergeData(data, d); else if (confirmBox('REPLACE all current data with this backup?')) data = d; else return;
      for (const k of COLLECTIONS) data[k] = data[k] || []; materialize(); save(); render(); toast('Import complete');
    } catch (err) { toast('Import failed: ' + err.message); }
  }; r.readAsText(f); e.target.value = '';
}

  };
  $$('[data-k]', el).forEach(b => b.onclick = () => press(b.dataset.k));
  const kd = e => { if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); e.stopPropagation(); };
  document.addEventListener('keydown', kd, true);
}
let unlockCbs = [];
function onUnlock() { const cbs = unlockCbs; unlockCbs = []; cbs.forEach(f => f()); }
function setPinFlow() {
  const m = modal(`<h2><span class="grow">Set PIN</span><button class="icon-btn" onclick="closeModal()">✕</button></h2>
    <div class="field"><label>New PIN (4–6 digits)</label><input id="p1" type="password" inputmode="numeric" maxlength="6" autofocus></div>
    <div class="field"><label>Confirm PIN</label><input id="p2" type="password" inputmode="numeric" maxlength="6"></div>
    <div class="actions"><button class="btn sec-btn" onclick="closeModal()">Cancel</button><button class="btn" id="pS">Save PIN</button></div>`);
  $('#pS').onclick = async () => { const a = $('#p1').value, b = $('#p2').value; if (!/^\d{4,6}$/.test(a)) return toast('PIN must be 4–6 digits'); if (a !== b) return toast("PINs don't match");
    const salt = uid(); local.pin = {salt, hash: await sha256(salt + a), len: a.length}; saveLocal(); closeModal(); render(); toast('PIN set 🔒'); };
}
function idleWatch() {
  ['pointerdown', 'keydown', 'scroll', 'touchstart'].forEach(ev => addEventListener(ev, () => { lastAct = now(); }, {passive: true}));
  const check = () => { if (local.pin && !$('#lock') && now() - lastAct > local.lockMin * 60e3) showLock(); };
  setInterval(check, 15e3);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') lastAct = Math.min(lastAct, now()); else check(); });
}

/* ---------- keyboard ---------- */
function keys() {
  document.addEventListener('keydown', e => {
    if ($('#lock')) return;
    if (e.key === 'Escape') { closeModal(); return; }
    const tag = (e.target.tagName || '').toLowerCase(); if (['input', 'select', 'textarea'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
    if ($('#modalBg')) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openTxn({type: 'expense'}); }
    else if (k === 'i') { e.preventDefault(); openTxn({type: 'income'}); }
    else if (k === 't') { e.preventDefault(); openTxn({type: 'transfer'}); }
    else if (k === 'h') toggleHide();
    else if (k === 'l') local.pin && showLock();
    else if (k === '/') { e.preventDefault(); go('activity'); setTimeout(() => $('#aQ')?.focus(), 30); }
    else if (/^[1-6]$/.test(k)) go(NAV[+k - 1][0]);
  });
}

/* ---------- boot ---------- */
async function boot() {
  load();
  applyTheme();
  await Sync.handleRedirect();
  materialize();
  shell(); keys(); idleWatch(); render();
  if (local.pin) { unlockCbs.push(() => { render(); Sync.start(); whatsNew(); }); showLock(); } else { Sync.start(); whatsNew(); }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => { if (local._day !== today()) { local._day = today(); materialize(); render(); } }, 60e3);
}
document.addEventListener('DOMContentLoaded', boot);

</script>
